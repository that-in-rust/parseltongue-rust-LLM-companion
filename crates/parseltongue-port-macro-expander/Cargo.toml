[package]
name = "parseltongue-port-macro-expander"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parseltongue-core-row-types = { path = "../parseltongue-core-row-types" }
ra_ap_syntax = { package = "syntax", path = "../../../rust-tools/rust-analyzer/crates/syntax" }
parser = { package = "parser", path = "../../../rust-tools/rust-analyzer/crates/parser" }
tt = { package = "ra_ap_tt", version = "=0.0.362" }
span = { package = "ra_ap_span", version = "=0.0.362", default-features = false }
intern = { package = "ra_ap_intern", version = "=0.0.362" }
stdx = { package = "ra_ap_stdx", version = "=0.0.362" }
ra-ap-rustc_lexer = { version = "0.180", default-features = false }
rustc-hash = "2"
smallvec = "1"
arrayvec = "0.7"
bitflags = "2"
cov-mark = "2"

[lints]
workspace = true
