[package]
name = "parseltongue-cli-dispatcher-binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-production-heap-allocator"]
native-production-heap-allocator = ["parseltongue-turso-store-adapter/native-production-heap-allocator"]
system-heap-allocation-profile = ["dep:dhat"]

[[bin]]
name = "parseltongue"
path = "src/main.rs"

[dependencies]
parseltongue-core-row-types = { path = "../parseltongue-core-row-types" }
parseltongue-table-store-traits = { path = "../parseltongue-table-store-traits" }
parseltongue-turso-store-adapter = { path = "../parseltongue-turso-store-adapter", default-features = false }
parseltongue-crate-graph-loader = { path = "../parseltongue-crate-graph-loader" }
parseltongue-syntax-span-extractor = { path = "../parseltongue-syntax-span-extractor" }
parseltongue-stage-worker-scheduler = { path = "../parseltongue-stage-worker-scheduler" }
serde_json = "1"
blake3 = "1"
ctrlc = { version = "3", features = ["termination"] }
dhat = { version = "=0.3.3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
