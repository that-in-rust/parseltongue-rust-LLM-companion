[package]
name = "parseltongue-turso-store-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-production-heap-allocator"]
native-production-heap-allocator = ["turso/mimalloc"]

[dependencies]
parseltongue-core-row-types = { path = "../parseltongue-core-row-types" }
parseltongue-table-store-traits = { path = "../parseltongue-table-store-traits" }
turso = { version = "=0.9.0-pre.5", default-features = false, features = ["fts", "simd"] }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
