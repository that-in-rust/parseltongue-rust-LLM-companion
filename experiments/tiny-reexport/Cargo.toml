[package]
name = "tiny-reexport"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "tiny-reexport"

[workspace]

[dependencies]
anyhow = "1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[[bin]]
name = "learned-binding"
path = "learned-binding/main.rs"
