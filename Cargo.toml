[workspace]
members = [
    "crates/parseltongue-core-row-types",
    "crates/parseltongue-table-store-traits",
    "crates/parseltongue-turso-store-adapter",
    "crates/parseltongue-duckdb-analysis-adapter",
    "crates/parseltongue-crate-graph-loader",
    "crates/parseltongue-syntax-span-extractor",
    "crates/parseltongue-stage-worker-scheduler",
    "crates/parseltongue-cli-dispatcher-binary",
    "crates/parseltongue-port-name-resolver",
    "crates/parseltongue-port-macro-expander",
    "crates/parseltongue-macro-span-records",
]
resolver = "3"
exclude = ["tools/oracle-semantic-export-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[patch.crates-io]
ra_ap_span = { path = "crates/parseltongue-macro-span-records" }
