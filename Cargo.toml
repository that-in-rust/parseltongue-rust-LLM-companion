[workspace]
members = [
    "crates/parseltongue-core-row-types",
    "crates/parseltongue-table-store-traits",
    "crates/parseltongue-turso-store-adapter",
]
resolver = "3"
exclude = ["tools/oracle-semantic-export-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
