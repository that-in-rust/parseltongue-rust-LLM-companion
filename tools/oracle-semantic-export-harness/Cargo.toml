[package]
name = "oracle-semantic-export-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "../parser-source-build-identity.rs"

[workspace]

[dependencies]
ide = { path = "../../../rust-tools/rust-analyzer/crates/ide" }
hir = { path = "../../../rust-tools/rust-analyzer/crates/hir" }
blake3 = "1"
serde_json = "1"
load-cargo = { path = "../../../rust-tools/rust-analyzer/crates/load-cargo" }
project-model = { path = "../../../rust-tools/rust-analyzer/crates/project-model" }
ide-db = { path = "../../../rust-tools/rust-analyzer/crates/ide-db" }
syntax = { path = "../../../rust-tools/rust-analyzer/crates/syntax" }
vfs = { path = "../../../rust-tools/rust-analyzer/crates/vfs" }
cfg = { path = "../../../rust-tools/rust-analyzer/crates/cfg", features = ["syntax"] }
vfs-notify = { path = "../../../rust-tools/rust-analyzer/crates/vfs-notify" }
proc-macro-api = { path = "../../../rust-tools/rust-analyzer/crates/proc-macro-api" }
hir-expand = { path = "../../../rust-tools/rust-analyzer/crates/hir-expand" }
crossbeam-channel = "0.5"
parseltongue-core-row-types = { path = "../../crates/parseltongue-core-row-types" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
serde_json = "1"
